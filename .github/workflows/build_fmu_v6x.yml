name: Build FMU v6x multicopter firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FIRMWARE_VERSION_SERIES: "1.16"

concurrency:
  group: build-fmu-v6x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build px4_fmu-v6x_multicopter
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-nuttx-focal:2022-08-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build firmware
        run: make px4_fmu-v6x_multicopter

      - name: Determine release version
        id: version
        run: |
          latest_tag="$(git tag --list "firmware-v${FIRMWARE_VERSION_SERIES}.*" --sort=-v:refname | head -n 1)"
          sequence=1

          if [[ "${latest_tag}" =~ ^firmware-v[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
            sequence=$((10#${BASH_REMATCH[1]} + 1))
          fi

          printf -v build_number '%03d' "${sequence}"
          version="${FIRMWARE_VERSION_SERIES}.${build_number}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release files
        run: |
          mkdir -p release
          cp build/px4_fmu-v6x_multicopter/px4_fmu-v6x_multicopter.px4 \
            "release/MAVTech-PX4-v6x-multicopter-${{ steps.version.outputs.version }}.px4"
          cp build/px4_fmu-v6x_multicopter/px4_fmu-v6x_multicopter.bin \
            "release/MAVTech-PX4-v6x-multicopter-${{ steps.version.outputs.version }}.bin"
          sha256sum release/*.px4 release/*.bin > release/SHA256SUMS.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: MAVTech-firmware-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-v${{ steps.version.outputs.version }}
          name: MAVTech Firmware ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Firmware PX4 per FMUv6X multicopter.

            Versione: ${{ steps.version.outputs.version }}
            Target: px4_fmu-v6x_multicopter
            Commit: ${{ github.sha }}

            Usa il file .px4 con QGroundControl oppure il file .bin per il flashing diretto.
          files: release/*
          fail_on_unmatched_files: true
