name: Build FMU v6x multicopter firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FIRMWARE_VERSION: "1.16.0"

jobs:
  build:
    name: Build px4_fmu-v6x_multicopter
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-nuttx-focal:2022-08-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build firmware
        run: make px4_fmu-v6x_multicopter

      - name: Create and push sequential annotated tag
        id: version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in {1..10}; do
            git fetch --force --tags origin

            latest_tag="$(git tag --list "v${FIRMWARE_VERSION}-0.0.*" --sort=-v:refname | head -n 1)"
            sequence=1

            if [[ "${latest_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-0\.0\.([0-9]+)$ ]]; then
              sequence=$((10#${BASH_REMATCH[1]} + 1))
            fi

            printf -v release_number '%03d' "${sequence}"
            tag="v${FIRMWARE_VERSION}-0.0.${sequence}"
            git tag -a "${tag}" \
              -m "MAVTech PX4 ${FIRMWARE_VERSION} - Release ${release_number}" \
              "${GITHUB_SHA}"

            if git push origin "${tag}"; then
              echo "sequence=${sequence}" >> "${GITHUB_OUTPUT}"
              echo "release_number=${release_number}" >> "${GITHUB_OUTPUT}"
              echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git tag --delete "${tag}"
          done

          echo "Unable to reserve a sequential firmware tag after 10 attempts" >&2
          exit 1

      - name: Prepare release files
        run: |
          mkdir -p release
          cp build/px4_fmu-v6x_multicopter/px4_fmu-v6x_multicopter.px4 \
            "release/MAVTech-PX4-v${FIRMWARE_VERSION}-R${{ steps.version.outputs.release_number }}.px4"
          cp build/px4_fmu-v6x_multicopter/px4_fmu-v6x_multicopter.bin \
            "release/MAVTech-PX4-v${FIRMWARE_VERSION}-R${{ steps.version.outputs.release_number }}.bin"
          sha256sum release/*.px4 release/*.bin > release/SHA256SUMS.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: MAVTech-PX4-v${{ env.FIRMWARE_VERSION }}-R${{ steps.version.outputs.release_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MAVTech PX4 ${{ env.FIRMWARE_VERSION }} - Release ${{ steps.version.outputs.release_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Firmware PX4 per FMUv6X multicopter.

            Versione: ${{ env.FIRMWARE_VERSION }}
            Release: ${{ steps.version.outputs.release_number }}
            Target: px4_fmu-v6x_multicopter
            Commit: ${{ github.sha }}

            Usa il file .px4 con QGroundControl oppure il file .bin per il flashing diretto.
          files: release/*
          fail_on_unmatched_files: true
